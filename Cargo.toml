[workspace]
resolver = "3"
members = [
    "crates/inference",
    "crates/server",
    "crates/app",
]

[workspace.package]
authors = ["Manish Kumar <manish@neocraft.tech>"]
edition = "2024"
homepage = "https://neocraft.tech/"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/neocrafttech/craft-vani"
rust-version = "1.93.0"
version = "0.1.0"

[workspace.dependencies]
mimalloc = { version = "*", features = ["v3"] }
serde = { version = "1.0.171", features = ["derive"] }