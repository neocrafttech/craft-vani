version: "3.8"

services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - web

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    expose:
      - "3000"
    environment:
      - MODEL_NAME=${MODEL_NAME}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
    volumes:
      - ./${MODEL_NAME}:/app/${MODEL_NAME}:ro
    networks:
      - web

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        TRUNK_PUBLIC_API_URL: wss://api.craftvani.in/ws
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
