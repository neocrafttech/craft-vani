[package]
name = "server"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true



[dependencies]
inference = { path = "../inference" }
accelerate-src = { version = "0.3.2", optional = true }
candle-transformers = "0.9.2"
clap = { version = "4.2.4", features = ["derive"] }
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"] , optional = true }
axum = { version = "0.8.8", features = ["ws"] }
tokio = { version = "1.36", features = ["full"] }
tower-http = { version = "0.6.2", features = ["cors", "fs"] }
futures-util = "0.3.30"
bincode = "1.3.3"
anyhow = "1"
rand = "0.9.0"
hound = "3.5.1"
rubato = "0.14"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.99"
tokenizers = { version = "0.22.0", features = ["onig"] }
tracing-subscriber = "0.3.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
dotenvy = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
candle = { version = "0.9.2", package = "candle-core", default-features = false, features = ["cuda"] }
candle-nn = { version = "0.9.2", default-features = false, features = ["cuda"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle = { version = "0.9.2", package = "candle-core", default-features = false }
candle-nn = { version = "0.9.2", default-features = false }

[features]
accelerate = [
    "accelerate-src",
    "candle/accelerate",
    "candle-nn/accelerate",
    "candle-transformers/accelerate",
]
mkl = [
"dep:intel-mkl-src",
"candle/mkl",
"candle-nn/mkl",
"candle-transformers/mkl",
]
